name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Export web build
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_GREENHOUSE_BOARD_TOKEN: ${{ secrets.EXPO_PUBLIC_GREENHOUSE_BOARD_TOKEN }}
          EXPO_PUBLIC_GREENHOUSE_ORG_NAME: ${{ secrets.EXPO_PUBLIC_GREENHOUSE_ORG_NAME }}
          EXPO_PUBLIC_USAJOBS_API_KEY: ${{ secrets.EXPO_PUBLIC_USAJOBS_API_KEY }}
          EXPO_PUBLIC_USAJOBS_USER_AGENT: ${{ secrets.EXPO_PUBLIC_USAJOBS_USER_AGENT }}
          EXPO_PUBLIC_USAJOBS_KEYWORD: ${{ secrets.EXPO_PUBLIC_USAJOBS_KEYWORD }}
          EXPO_PUBLIC_USAJOBS_LOCATION: ${{ secrets.EXPO_PUBLIC_USAJOBS_LOCATION }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      # GitHub Pages serves project repos from /<repo-name>/, but Expo's web
      # export writes root-absolute asset paths (href="/...", src="/...") in
      # index.html. Rewriting just those two attributes to relative paths is
      # enough — everything else in the export already resolves relative to
      # the page's own URL.
      - name: Rewrite root-absolute paths for the Pages subpath
        run: |
          sed -i 's|href="/favicon.ico"|href="./favicon.ico"|; s|src="/_expo|src="./_expo|' dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
